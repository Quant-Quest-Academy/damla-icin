<style>
:root{
  --ink:#f8ecf1; --ink2:rgba(248,236,241,.64); --amber:#f7a8c6;
  --serif:'Caveat','Segoe Script','Bradley Hand',cursive;
  --hand:'Caveat','Segoe Script','Bradley Hand',cursive;
}
body.dawn{--ink:#4a2438;--ink2:rgba(74,36,56,.66);--amber:#c8407e}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden;background:#0d0810;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#0d0810;color:var(--ink);font-family:var(--serif);font-weight:500;line-height:1.3;-webkit-font-smoothing:antialiased;transition:color 2.5s ease;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
::selection{background:rgba(240,178,90,.35)}

#glass,#fog{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#glass{z-index:0}
#fog{z-index:1;opacity:0}
#touch{position:fixed;inset:0;z-index:2;touch-action:none;cursor:crosshair;-webkit-tap-highlight-color:transparent}

#caps{position:fixed;inset:0;z-index:3;pointer-events:none}
.cap{position:absolute;max-width:min(28rem,82vw);font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.25;transition:color 2.5s ease}
.cap small{display:block;font-size:.72em;color:var(--ink2);margin-top:.3em}
.cap em{font-style:normal;color:var(--amber)}
.cap.bl{left:8vw;bottom:14vh}
.cap.br{right:8vw;bottom:14vh;text-align:right}
.cap.tr{right:8vw;top:9vh;text-align:right}
.cap.tl{left:8vw;top:9vh}
.cap.ml{left:8vw;top:50%;transform:translateY(-50%)}
.cap.c{left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;max-width:92vw}
.cap.bc{left:50%;bottom:14vh;transform:translateX(-50%);text-align:center;max-width:90vw}
.cap.big{font-weight:600;font-size:clamp(4rem,12vw,9.5rem);line-height:1}
.cap.mid{font-weight:600;font-size:clamp(2.6rem,7vw,5.5rem);line-height:1.1;top:40%}
.cap .w{white-space:nowrap;display:inline-block}
.cap .w span{display:inline-block;opacity:0;transform:translateY(.35em);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i)*28ms)}
.cap.big .w span{transform:translateY(.25em) rotate(2deg);transition-duration:.9s,1.1s;transition-delay:calc(var(--i)*55ms)}
.cap.on .w span{opacity:1;transform:none}
.cap small,.cap .nl{transition:opacity 1s ease .6s;opacity:0}
.cap.on small{opacity:1}
.cap.off .w span{opacity:0;transform:translateY(-.2em);transition-delay:calc(var(--i)*10ms);transition-duration:.5s,.5s}
.cap.off small{opacity:0;transition-delay:0s;transition-duration:.4s}
.cap a{color:var(--ink2);text-decoration:none;border-bottom:1px solid currentColor;pointer-events:auto;cursor:pointer}
.cap a:hover{color:var(--ink)}

#hint{position:fixed;left:50%;bottom:calc(5vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;font-size:clamp(1.9rem,3.2vw,2.4rem);font-weight:600;color:var(--ink);color:var(--ink2);opacity:0;transition:opacity .9s ease,color 2.5s ease;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:.55rem;white-space:nowrap}
#hint i{display:block;width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
#hint.show{opacity:1}
#score{position:fixed;left:50%;top:calc(4vh + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:3;font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:600;color:var(--amber);opacity:0;transition:opacity .8s ease;pointer-events:none;white-space:nowrap}
#score.show{opacity:1}
#score b{display:inline-block;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#score.pop b{transform:scale(1.45)}

.sound{position:fixed;right:calc(1.4rem + env(safe-area-inset-right,0px));bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));z-index:4;font-size:1.1rem;padding:.4rem .6rem;color:var(--ink2);cursor:pointer;opacity:0;transition:opacity 1.2s ease 2.5s,color 2.5s ease}
body.lit .sound{opacity:1}
.sound:hover{color:var(--ink)}

@media (max-width:760px){
  .cap{font-size:1.6rem;max-width:84vw}
  .cap.ml{top:36%}
  .cap.tr,.cap.tl{top:calc(6vh + env(safe-area-inset-top,0px))}
  .cap.bl,.cap.br,.cap.bc{bottom:calc(15vh + env(safe-area-inset-bottom,0px))}
  .cap.bl,.cap.tl,.cap.ml{left:7vw}
  .cap.br,.cap.tr{right:7vw}
  .sound{bottom:calc(.8rem + env(safe-area-inset-bottom,0px));right:calc(.8rem + env(safe-area-inset-right,0px))}
}
@media (max-width:760px) and (orientation:landscape){
  .cap{font-size:1.3rem}
  .cap.big{font-size:clamp(3rem,12vh,6rem)}
}
</style>

<body>
<canvas id="glass"></canvas>
<canvas id="fog"></canvas>
<div id="touch"></div>
<div id="caps"></div>
<div id="hint"><span></span><i></i></div>
<div id="score"></div>
<div class="sound" id="sound"></div>

<script>
/* ============================================================
   METİNLER. Her sahnenin ipucu (hint) ve notları (caps).
   t: sahne başladıktan kaç ms sonra görünsün. pos: konum.
   ============================================================ */
const CONFIG = {
  fogWord: "hayatımda gördüğüm|en güzel kız",          /* | = yeni satır */
  fogWordNarrow: "hayatımda|gördüğüm|en güzel kız",     /* dar ekranlarda (telefon) */
  name: "damla",
  sound: { on: "ses açık", off: "ses kapalı" },
  scenes: {
    cloud: {
      hint: { touch: "ekrana basılı tut", mouse: "ekrana basılı tut" },
      caps: [ { t: 500, pos: "bl", html: "damla<br>sana bişey yaptım" } ],
      holding: { pos: "tr", html: "her şey bi damlayla başlar" }
    },
    fall: {
      hint: "damlayı sürükle ışıkları yakala",
      caps: [
        { t: 3000, pos: "ml", html: "milyonlarca damla var<br>hiçbiri aynı değil", dur: 6000 }
      ],
      goal: 7,                 /* kaç ışık yakalayınca pencereye varsın */
      done: { pos: "ml", html: "hepsini yakaladın", dur: 3000 },
      duration: 50000          /* yakalayamazsa bile en geç bu sürede geçer */
    },
    window: {
      hint: "camı sil",
      caps: [ { t: 9000, pos: "bl", html: "dışarsı yağmur<br>içerisi sıcak" } ]
    },
    beads: {
      hint: "cama dokun",
      caps: [ { t: 7500, pos: "tr", html: "bazen damlalar bişey yazıyo" } ]
    },
    sea: {
      hint: "suya dokun",
      caps: [
        { t: 1500, pos: "ml", html: "sonra deniz" },
        { t: 9000, pos: "br", html: "her dokunuşunda<br>sabah yaklaşıyo" }
      ],
      compliment: null
    },
    end: {
      caps: [
        { t: 1500, pos: "c", mid: true, html: "çok tatlı birisin damla", stay: true },
        { t: 5000, pos: "bc", html: "senden&nbsp;bi&nbsp;tane&nbsp;daha&nbsp;yok<br>aynı&nbsp;damlalar&nbsp;gibi<br>umarım&nbsp;beğenmişsindir<br><a>baştan</a>", stay: true }
      ]
    }
  }
};

(() => {
"use strict";
const $ = s => document.querySelector(s);
const isTouch = matchMedia('(hover:none)').matches;
const sat = x => Math.max(0, Math.min(1, x));
const smooth = (a, b, x) => { const t = sat((x - a)/(b - a)); return t*t*(3 - 2*t); };
$('#sound').textContent = CONFIG.sound.off;

/* ---------- captions ---------- */
const capsEl = $('#caps'); let live = [];
function showCap(c){
  const el = document.createElement('p');
  el.className = 'cap ' + c.pos + (c.big ? ' big' : '') + (c.mid ? ' mid' : '');
  const parts = c.html.split(/<small>|<\/small>/);
  const main = parts[0], small = parts[1];
  let i = 0, inEm = false;
  main.split('<br>').forEach((line, li) => {
    if (li) el.appendChild(document.createElement('br'));
    line.split(' ').forEach((word, wi, arr) => {
      const w = document.createElement('span'); w.className = 'w';
      if (word.indexOf('<em>') >= 0) inEm = true;
      const closes = word.indexOf('</em>') >= 0;
      const isLink = word.indexOf('<a>') >= 0;
      const tmp = document.createElement('span'); tmp.innerHTML = word;
      const text = tmp.textContent;
      if (isLink){
        const a = document.createElement('a'); a.textContent = text; a.style.opacity = 0; a.style.transition = 'opacity 1s ease 1.2s';
        a.addEventListener('click', e => { e.preventDefault(); location.reload(); });
        w.appendChild(a); setTimeout(() => a.style.opacity = 1, 50);
      } else {
        [...text].forEach(ch => { const s = document.createElement('span'); s.style.setProperty('--i', i++); if (inEm){ const e = document.createElement('em'); e.textContent = ch; s.appendChild(e); } else s.textContent = ch; w.appendChild(s); });
      }
      if (closes) inEm = false;
      el.appendChild(w); if (wi < arr.length - 1) el.appendChild(document.createTextNode(' '));
    });
  });
  if (small){ const s = document.createElement('small'); s.innerHTML = small; el.appendChild(s); }
  capsEl.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  const rec = { el, born: performance.now(), stay: !!c.stay, dur: c.dur || 8500 };
  live.push(rec); return rec;
}
function hideCap(rec){ if (!rec || rec.dead) return; rec.dead = true; rec.el.classList.add('off'); setTimeout(() => rec.el.remove(), 1200); }
function hideAll(){ live.forEach(hideCap); live = []; }
const hintEl = $('#hint'), hintTxt = hintEl.querySelector('span');
let hintTimer = 0;
function hint(text, delay = 0){
  clearTimeout(hintTimer); hintEl.classList.remove('show');
  if (!text) return;
  hintTimer = setTimeout(() => { hintTxt.textContent = text; hintEl.classList.add('show'); }, delay + 400);
}

/* ---------- shapes ---------- */
function heartPath(g, s){ g.beginPath(); g.moveTo(0, s*.32); g.bezierCurveTo(-s*1.12, -s*.42, -s*.56, -s*1.08, 0, -s*.42); g.bezierCurveTo(s*.56, -s*1.08, s*1.12, -s*.42, 0, s*.32); g.closePath(); }
function dropPath(g, s){ g.beginPath(); g.moveTo(0, -s); g.bezierCurveTo(s*.1, -s*.45, s*.72, -s*.1, s*.72, s*.3); g.bezierCurveTo(s*.72, s*.88, -s*.72, s*.88, -s*.72, s*.3); g.bezierCurveTo(-s*.72, -s*.1, -s*.1, -s*.45, 0, -s); g.closePath(); }

/* ---------- the world (WebGL) ---------- */
const world = (() => {
  const c = $('#glass');
  const gl = c.getContext('webgl', { antialias:false, alpha:false, powerPreference:'high-performance' });
  const dead = { frame(){}, set(){}, ripple(){}, setShape(){}, screenToSea(){ return null; }, time(){ return 0; }, setOrb(){}, burst(){}, degrade(){ return false; } };
  if (!gl){ c.style.background = 'radial-gradient(ellipse at 50% 110%, #2a1a0c, #06080e 60%)'; return dead; }
  const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs = `
precision highp float;
uniform vec2 u_res; uniform float u_time; uniform float u_p; uniform float u_hold; uniform vec2 u_mouse; uniform vec2 u_drop; uniform float u_dropR;
uniform float u_flash; uniform float u_shape; uniform float u_morph; uniform float u_vel;
uniform sampler2D u_maskA; uniform sampler2D u_maskB;
uniform vec4 u_rip[10]; uniform vec4 u_orbs[8]; uniform vec4 u_bursts[6];

float sat(float x){ return clamp(x, 0., 1.); }
float h11(float p){ p = fract(p*.1031); p *= p + 33.33; p *= p + p; return fract(p); }
vec2 h22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz)*p3.zy); }
float h21(vec2 p){ return h22(p).x; }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(h21(i), h21(i + vec2(1.,0.)), f.x), mix(h21(i + vec2(0.,1.)), h21(i + vec2(1.,1.)), f.x), f.y); }
float fbm(vec2 p){ float v = 0., a = .5; mat2 m = mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<5;i++){ v += a*noise(p); p = m*p; a *= .5; } return v; }

/* a real drop: round belly, pointed tip on top. returns a distance-like value (compare to r) */
float teardrop(vec2 d, float r){
  float k = sat((d.y + r)/(r*2.7));
  float w = 1. - pow(k, 1.45)*.985;
  vec2 q = vec2(d.x/max(w, .02), (d.y - r*.35)/1.35);
  return length(q);
}

/* ===== bokeh city lights ===== */
vec3 lights(vec2 uv, float blur, float t){
  vec3 col = vec3(0.);
  for(int l=0;l<3;l++){
    float fl = float(l); float sc = 2.2 + fl*1.8;
    vec2 p = uv*sc + vec2(fl*13.7, fl*7.1); vec2 id = floor(p); vec2 f = fract(p) - .5;
    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
      vec2 o = vec2(float(i), float(j)); vec2 cid = id + o; vec2 h = h22(cid + fl*31.7);
      float lit = step(.5, h21(cid + 9.1 + fl));
      vec2 cc = o + (h - .5)*.95; float r = .05 + h.x*.1; float d = length(f - cc);
      float m = smoothstep(r + blur*sc, r - blur*sc*.3, d);
      float hue = h21(cid + 77.3 + fl*3.);
      vec3 lc = mix(vec3(1., .5, .72), vec3(1., .8, .74), step(.42, hue)); lc = mix(lc, vec3(1., .92, .95), step(.72, hue)); lc = mix(lc, vec3(.7, .8, 1.), step(.9, hue));
      float br = .3 + .7*h.y; br *= .85 + .15*sin(t*(.4 + h.y*1.2) + hue*6.28);
      col += lc*m*br*lit*(1. - fl*.28);
    }
  }
  return col;
}

/* ===== scene 0: inside the cloud. hold to gather the mist into a drop ===== */
vec3 cloudBase(vec2 uv, float t, float p, float hold, vec2 dp){
  vec2 toD = dp - uv; float dist = length(toD);
  float g = smoothstep(1.1, .0, dist)*hold;
  vec2 q = uv*1.6 + vec2(t*.02 + sin(t*.1)*.05, -t*.012 + p*6.) + toD*g*1.4 + u_mouse*.08;
  float n = fbm(q*2.); float n2 = fbm(q*4. + n*1.5 + t*.03);
  vec3 dark = vec3(.03,.018,.04), mid = vec3(.14,.09,.15), lit = vec3(.34,.25,.34);
  vec3 col = mix(dark, mid, smoothstep(.3,.7,n)); col = mix(col, lit, smoothstep(.55,.9,n2)*.6);
  float moon = exp(-length(uv - vec2(.45,.35 + p*1.2))*2.5);
  col += vec3(.85,.55,.72)*moon*.35*(.6 + .4*n2);
  /* the mist glows where it gathers */
  col += vec3(.8,.42,.62)*g*.35*(.4 + .6*n2)*smoothstep(.02, .25, dist);
  /* swirl streaks spiralling in */
  float ang = atan(toD.y, toD.x);
  float sw = sin(ang*5. + dist*30. - t*4.)*.5 + .5;
  col += vec3(.8,.45,.65)*pow(sw, 6.)*smoothstep(.45, .05, dist)*hold*.25*smoothstep(.03, .12, dist);
  return col;
}
vec3 sceneCloud(vec2 uv, float t, float p, float hold, vec2 dp, float r){
  vec3 col = cloudBase(uv, t, p, hold, dp);
  vec2 d = uv - dp; float len = teardrop(d, r);
  float m = smoothstep(r, r*.9, len);
  if (m > 0.){
    vec2 ruv = uv - d*1.8;
    vec3 inner = cloudBase(ruv, t, p, hold, dp)*1.35 + vec3(.16,.1,.17);
    float spec = pow(sat(dot(d/max(length(d),1e-4), vec2(-.6,.8))), 6.)*smoothstep(r*.5, r, len);
    col = mix(col, inner, m) + vec3(1.,.95,.97)*spec*m*.85;
    col += vec3(.95,.7,.85)*smoothstep(r*.6, r, len)*m*.14;
  }
  col += vec3(.95,.65,.8)*smoothstep(r*2., r, len)*(1. - m)*.2;
  return col;
}

/* ===== scene 1: falling with the rain over the city ===== */
vec3 sceneFall(vec2 uv, float t, float p, float wind){
  float local = sat((p - .14)/.26);
  uv += vec2(sin(t*31.)*.0025, cos(t*23.)*.0025)*(.4 + u_vel);
  vec3 col = mix(vec3(.02,.013,.038), vec3(.05,.03,.06), uv.y + .5);
  float cl = fbm(uv*2.2 + vec2(t*.03 + u_mouse.x*.2, -local*2.5 - t*.05));
  col += vec3(.11,.08,.12)*smoothstep(.4,.85,cl)*(1. - local*.7);
  float zoom = mix(.2, 1.35, local*local);
  vec2 cuv = (uv - vec2(0., -.75))/zoom + vec2(5.1, 2.7) + (u_mouse - .5)*.15;
  float lm = smoothstep(.2, -.45, uv.y);
  vec3 L = lights(cuv, mix(.09, .03, local), t)*lm*(.25 + .75*local);
  col += 1. - exp(-L*1.4);
  for(int i=0;i<4;i++){
    float fi = float(i); float depth = .5 + fi*.45; float sc = 10.*depth;
    vec2 q = vec2(uv.x*sc + uv.y*wind*sc*.3, uv.y*sc*.28 - t*(1.6 + fi*.8) - fi*3.7);
    vec2 id = floor(q); vec2 f = fract(q) - .5; vec2 h = h22(id + fi*13.1);
    float ex = step(.55, h.x); float x = (h.y - .5)*.7;
    float m = smoothstep(.05, .0, abs(f.x - x))*smoothstep(.42 + u_vel*.06, .25, abs(f.y))*ex;
    m *= .7 + .6*smoothstep(.3, -.3, f.y);
    col += vec3(.95,.8,.9)*m*(.22/depth)*(1. + local*.5);
  }
  col += vec3(1.,.8,.9)*u_flash*(.35 + .65*smoothstep(.3,.9,cl));
  return col;
}

/* ===== scene 2: rain on the window ===== */
vec3 slide(vec2 uv, float t, float seed, float cols, float ex){
  float s = 1./cols; float cx = floor(uv.x/s); float hc = h11(cx*7.31 + seed);
  float speed = .05 + hc*.1;
  vec2 p = vec2(uv.x, uv.y + t*speed + hc*5.3);
  vec2 id = floor(p/s); vec2 h = h22(id + seed*3.1);
  float exist = step(ex, h.x); vec2 cellO = id*s;
  float amp = s*.13; float ph = h.y*6.2831;
  float dcy = cellO.y + s*.2; float baseX = cellO.x + s*(.3 + h.y*.4);
  vec2 dpos = vec2(baseX + sin(dcy*21. + ph)*amp, dcy);
  float r = s*.17*(.75 + h.x*.5);
  vec2 d = p - dpos; float m = smoothstep(r, r*.78, length(d))*exist;
  vec2 off = -d/r*m;
  float spacing = s*.105;
  float k = clamp(floor((p.y - dpos.y)/spacing + .5), 1., 5.);
  float ty = dpos.y + k*spacing; float tx = baseX + sin(ty*21. + ph)*amp;
  vec2 td = p - vec2(tx, ty); float tr = r*(.42 - k*.06);
  float tm = smoothstep(tr, tr*.6, length(td))*exist*step(dpos.y + spacing*.5, p.y);
  off += -td/max(tr, 1e-4)*tm*.7; m = max(m, tm*.85);
  return vec3(off, m);
}
vec3 beads(vec2 uv, float t, float cols, float seed, float dens){
  float s = 1./cols; vec2 id = floor(uv/s); vec2 h = h22(id + seed);
  vec2 c = (id + .25 + h*.5)*s; float r = s*(.14 + h.y*.16);
  float life = sin(t*.2 + h.x*41.)*.5 + .5; float on = smoothstep(dens, dens + .15, life);
  vec2 d = uv - c; float m = smoothstep(r, r*.7, length(d))*on;
  return vec3(-d/r*m, m);
}
/* her name, written on the wet glass with a finger: a raised film of water with a rounded profile */
vec4 waterText(vec2 frag){
  float reveal = smoothstep(u_shape*1.2 + .04, u_shape*1.2 - .08, frag.x);
  float m = texture2D(u_maskA, frag).a;
  float e = 1.5/1024.;
  float gx = texture2D(u_maskA, frag + vec2(e,0.)).a - texture2D(u_maskA, frag - vec2(e,0.)).a;
  float gy = texture2D(u_maskA, frag + vec2(0.,e)).a - texture2D(u_maskA, frag - vec2(0.,e)).a;
  /* dome height: flat in the middle, curving down at the edges */
  float h = smoothstep(0., 1., m);
  vec3 n = normalize(vec3(-vec2(gx, gy)*16.*(1. - h*.6), 1.));
  return vec4(n.xy*reveal, h*reveal, n.z);
}
vec3 sceneWindow(vec2 frag, float aspect, float t){
  vec2 uv = vec2(frag.x*aspect, frag.y);
  vec3 a = slide(uv, t, 1., 9., .58); vec3 b = slide(uv, t, 5., 19., .7);

vec3 skyFn(vec3 rd, float dawn, float t){

    box = { x0: Math.min(...lineBoxes.map(b => b.x0)), x1: Math.max(...lineBoxes.map(b => b.x1)), y0: lineBoxes[0].y0, y1: lineBoxes[lineBoxes.length - 1].y1 };
  }
  function reset(){
    ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, W, H); ctx.drawImage(tex, 0, 0);
    if (written){ ctx.globalCompositeOperation = 'destination-out'; ctx.drawImage(mask, 0, 0); ctx.globalCompositeOperation = 'source-over'; }
    drips.length = 0;
  }
  function resize(){ W = innerWidth; H = innerHeight; c.width = W; c.height = H; buildTex(); buildMask(); reset(); }
  resize(); addEventListener('resize', resize);
  function spawnDrips(){
    const data = mask.getContext('2d').getImageData(0, 0, W, H).data, n = (isTouch ? 4 : 6)*lineBoxes.length;
    for (let i = 0; i < n; i++){
      const lb = lineBoxes[i % lineBoxes.length];
      const x = Math.round(lb.x0 + (lb.x1 - lb.x0)*(.08 + Math.random()*.84)); let y = -1;
      for (let yy = Math.min(H - 1, Math.round(lb.y1)); yy >= lb.y0; yy--){ if (data[(yy*W + x)*4 + 3] > 60){ y = yy; break; } }
      if (y < 0) continue;
      drips.push({ x, y, len: 30 + Math.random()*150, w: 2 + Math.random()*3, p: 0, v: .004 + Math.random()*.006, delay: Math.random()*1400 });
    }
  }
  function erase(x, y, r, a){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(.6, `rgba(0,0,0,${a*.7})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  function coverage(){
    pctx.clearRect(0, 0, 48, 27); pctx.drawImage(c, 0, 0, 48, 27);
    const d = pctx.getImageData(0, 0, 48, 27).data; let s = 0;
    for (let i = 3; i < d.length; i += 4) s += d[i];
    return s/(d.length/4)/255;
  }
  return {
    canvas: c, erase, coverage,
    get written(){ return written; },
    write(){ if (written || writing) return; writing = true; writeT = 0; },
    frame(dt, now, visible){
      const ms = Math.min(100, now - (this._last || now)); this._last = now;
      if (!visible) return;
      if (writing){
        writeT = Math.min(1, writeT + ms/(2600*lineBoxes.length));
        const n = lineBoxes.length;
        ctx.save(); ctx.beginPath();
        lineBoxes.forEach((lb, i) => {
          const local = Math.max(0, Math.min(1, writeT*n - i));
          const e = local < .5 ? 2*local*local : -1 + (4 - 2*local)*local;
          if (e > 0) ctx.rect(0, lb.y0, lb.x0 + (lb.x1 - lb.x0)*e, lb.y1 - lb.y0);
        });
        ctx.clip(); ctx.globalCompositeOperation = 'destination-out'; ctx.drawImage(mask, 0, 0); ctx.restore();
        ctx.globalCompositeOperation = 'source-over';
        if (writeT >= 1){ writing = false; written = true; spawnDrips(); dripStart = now; }
      }
      if (drips.length){
        ctx.globalCompositeOperation = 'destination-out'; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.85)';
        for (const d of drips){
          if (now - dripStart < d.delay) continue;
          const prev = d.p; d.p = Math.min(1, d.p + d.v*dt*(1.2 - d.p)); if (d.p === prev) continue;
          ctx.lineWidth = d.w*(1 - d.p*.5); ctx.beginPath(); ctx.moveTo(d.x, d.y + d.len*prev); ctx.lineTo(d.x, d.y + d.len*d.p); ctx.stroke();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.globalAlpha = .0004*dt; ctx.drawImage(tex, 0, 0); ctx.globalAlpha = 1;
    }
  };
})();

/* ---------- sound: rain, thunder, plinks ---------- */
const audio = (() => {
  let ctx, rain, lp1, master, started = false, on = false, nextPlink = 0;
  const el = $('#sound');
  function build(){
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC();
    const sr = ctx.sampleRate, buf = ctx.createBuffer(2, sr*4, sr);
    for (let ch = 0; ch < 2; ch++){ const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    lp1 = ctx.createBiquadFilter(); lp1.type = 'lowpass'; lp1.frequency.value = 900; lp1.Q.value = .4;
    const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 2600; lp2.Q.value = .3;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 160;
    rain = ctx.createGain(); rain.gain.value = 0; master = ctx.createGain(); master.gain.value = 1;
    src.connect(hp); hp.connect(lp1); lp1.connect(lp2); lp2.connect(rain); rain.connect(master); master.connect(ctx.destination);
    const lfo = ctx.createOscillator(); lfo.frequency.value = .06; const lg = ctx.createGain(); lg.gain.value = .03; lfo.connect(lg); lg.connect(rain.gain); lfo.start(); src.start();
    return true;
  }
  function plink(t, f, vol){
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + .12 + Math.random()*.1);
    let out = g; if (ctx.createStereoPanner){ const p = ctx.createStereoPanner(); p.pan.value = Math.random()*1.6 - .8; g.connect(p); out = p; }
    o.connect(g); out.connect(master); o.start(t); o.stop(t + .3);
  }
  function thunder(){
    if (!ctx || !on) return;
    const t = ctx.currentTime + .6, sr = ctx.sampleRate, len = sr*3, buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/len, 1.6);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(260, t); lp.frequency.exponentialRampToValueAtTime(70, t + 2.5);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.55, t + .12); g.gain.exponentialRampToValueAtTime(.001, t + 3);
    s.connect(lp); lp.connect(g); g.connect(master); s.start(t); s.stop(t + 3.1);
  }
  function setOn(v){
    on = v; el.textContent = v ? CONFIG.sound.on : CONFIG.sound.off; if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    rain.gain.cancelScheduledValues(ctx.currentTime); rain.gain.setTargetAtTime(v ? .11 : 0, ctx.currentTime, 1.2);
  }
  el.addEventListener('click', e => { e.stopPropagation(); if (!started) started = build(); setOn(!on); });
  document.addEventListener('visibilitychange', () => { if (ctx && !document.hidden && on && ctx.state === 'suspended') ctx.resume(); });
  return {
    start(){ if (started){ if (ctx && ctx.state === 'suspended') ctx.resume(); return; } started = build(); if (started) setOn(true); },
    thunder,
    drop(){ if (ctx && on) plink(ctx.currentTime, 500 + Math.random()*300, .05); },
    catchOrb(n){ if (!ctx || !on) return; const base = [523, 587, 659, 784, 880, 1047, 1175][n % 7]; plink(ctx.currentTime, base, .06); plink(ctx.currentTime + .07, base*1.5, .035); },
    frame(now, p, state){
      if (!ctx || !on) return;
      if (now > nextPlink && p < .84 && state !== 'cloud'){ plink(ctx.currentTime, 1400 + Math.random()*2600, .01 + Math.random()*.012); nextPlink = now + 120 + Math.random()*900; }
      lp1.frequency.setTargetAtTime(state === 'cloud' ? 350 : (p > .66 ? 700 : 1100), ctx.currentTime, 1.5);
      const dawn = smooth(.84, .96, p);
      rain.gain.setTargetAtTime((state === 'cloud' ? .05 : .11)*(1 - dawn)*(p > .62 ? .8 : 1), ctx.currentTime, 1.5);
    }
  };
})();

/* ---------- state machine ---------- */
const S = CONFIG.scenes;
let state = 'cloud', stateAt = performance.now(), pT = 0, pS = 0, velS = 0, hold = 0, holdCapShown = false;
let fogVisT = 0, fogVis = 0, fogBase = -1, complimentShown = false, beadsTapReady = false;
let flashAt = -99, nextFlash = 0, down = false, lastPt = null, lastRipple = 0;
const mouse = [.5, .5], dropPos = [0, 0], dropTarget = [0, 0];
let dropR = 0, seaTouches = 0;
let timers = [];
/* the lights to catch while falling */
const ORBS = 8, orbList = []; for (let i = 0; i < ORBS; i++) orbList.push({ x: 0, y: 0, phase: 0, alive: 0 });
let caught = 0, gameDone = false, nextSpawn = 0; window.__orbs = orbList;
const scoreEl = $('#score');
function showScore(){ scoreEl.innerHTML = `<b>${caught}</b> / ${S.fall.goal}`; }
function enter(s){
  state = s; stateAt = performance.now(); hideAll(); window.__state = s;
  timers.forEach(clearTimeout); timers = [];
  const sc = S[s];
  if (sc.caps) sc.caps.forEach(c => timers.push(setTimeout(() => showCap(c), c.t)));
  const h = sc.hint; hint(typeof h === 'object' && h ? (isTouch ? h.touch : h.mouse) : h, s === 'beads' ? 8500 : (s === 'cloud' ? 2500 : 1800));
  if (s === 'fall'){ pT = .20; caught = 0; gameDone = false; nextSpawn = performance.now() + 1500; showScore(); timers.push(setTimeout(() => scoreEl.classList.add('show'), 1200)); }
  else { scoreEl.classList.remove('show'); orbList.forEach((o, i) => { o.alive = 0; world.setOrb(i, 0, 0, 0, 0); }); }
  if (s === 'window'){ pT = .47; fogVisT = 1; timers.push(setTimeout(() => fog.write(), 1500)); }
  if (s === 'beads'){ pT = .58; fogVisT = 0; world.setShape(true); timers.push(setTimeout(() => { beadsTapReady = true; }, 8000)); }
  if (s === 'sea'){ pT = .70; world.setShape(false); audio.drop(); }
  if (s === 'end'){ hint(null); }
}
enter('cloud');

/* ---------- pointer ---------- */
const touch = $('#touch');
function toUV(cx, cy){ const a = innerWidth/innerHeight; return [(cx/innerWidth - .5)*a, .5 - cy/innerHeight]; }
function setMouse(cx, cy){ mouse[0] = cx/innerWidth; mouse[1] = 1 - cy/innerHeight; const u = toUV(cx, cy); dropTarget[0] = u[0]; dropTarget[1] = u[1]; }
function tap(cx, cy){
  if (state === 'fall'){ /* steering only; the drop follows the finger */ }
  else if (state === 'window'){ fog.erase(cx, cy, isTouch ? 54 : 46, .95); }
  else if (state === 'beads'){ if (beadsTapReady) enter('sea'); }
  else if (state === 'sea'){
    const w = world.screenToSea(cx, cy); if (w){ world.ripple(w[0], w[1], 1); audio.drop(); seaTouches++; pT = Math.min(.99, pT + .028); }
  }
}
touch.addEventListener('pointerdown', e => {
  audio.start(); down = true; lastPt = [e.clientX, e.clientY]; setMouse(e.clientX, e.clientY); tap(e.clientX, e.clientY);
  try { touch.setPointerCapture(e.pointerId); } catch (_){}
});
touch.addEventListener('pointermove', e => {
  setMouse(e.clientX, e.clientY);
  if (!down || !lastPt) return;
  if (state === 'window'){
    const dx = e.clientX - lastPt[0], dy = e.clientY - lastPt[1], dist = Math.hypot(dx, dy), steps = Math.max(1, dist/6 | 0);
    for (let i = 1; i <= steps; i++) fog.erase(lastPt[0] + dx*i/steps, lastPt[1] + dy*i/steps, isTouch ? 54 : 46, .92);
  }
  if (state === 'sea'){
    const now = performance.now();
    if (now - lastRipple > 140 && Math.hypot(e.clientX - lastPt[0], e.clientY - lastPt[1]) > 12){
      const w = world.screenToSea(e.clientX, e.clientY); if (w){ world.ripple(w[0], w[1], .35); lastRipple = now; pT = Math.min(.99, pT + .004); }
    }
  }
  lastPt = [e.clientX, e.clientY];
});
const up = () => { down = false; lastPt = null; };
addEventListener('pointerup', up); addEventListener('pointercancel', up);
/* iOS Safari: no rubber-band scroll, no pinch, no double-tap zoom; sound unlock on a real touch */
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchend', e => { audio.start(); if (e.target && e.target.closest && e.target.closest('a, .sound')) return; e.preventDefault(); }, { passive:false });
addEventListener('orientationchange', () => setTimeout(() => dispatchEvent(new Event('resize')), 300));
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter'){ if (!down){ down = true; tap(innerWidth/2, innerHeight/2); } e.preventDefault(); } });
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') up(); });
addEventListener('contextmenu', e => e.preventDefault());

const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('700 40px Caveat'), document.fonts.load('500 40px Caveat')]).catch(() => {}) : Promise.resolve();
fontsReady.then(() => { dispatchEvent(new Event('resize')); document.body.classList.add('lit'); });
setTimeout(() => document.body.classList.add('lit'), 4000);

/* ---------- main loop ---------- */
const start = performance.now(); let lastT = start, slowFrames = 0, perfChecks = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (document.hidden){ lastT = now; return; }
  const rawDt = (now - lastT)/16.667, dt = Math.min(2.5, rawDt); lastT = now;
  /* adaptive quality: if frames keep taking longer than ~28ms, render smaller */
  if (now - start > 4000 && perfChecks < 3){ if (rawDt > 1.7) slowFrames++; else slowFrames = Math.max(0, slowFrames - 1); if (slowFrames > 45){ slowFrames = 0; perfChecks++; world.degrade(); } }
  const sec = (now - start)/1000, inState = now - stateAt;

  /* --- per-state logic --- */
  if (state === 'cloud'){
    const ms = Math.min(100, rawDt*16.667);
    if (down) hold = Math.min(1, hold + ms/4200); else hold = Math.max(0, hold - ms/12000);
    if (hold > .3 && !holdCapShown){ holdCapShown = true; showCap(S.cloud.holding); hint(null); }
    dropR = .012 + .05*hold;
    if (hold >= 1){ timers.push(setTimeout(() => enter('fall'), 900)); hold = 1.001; }
  }
  if (state === 'fall'){
    const k = gameDone ? 1 : Math.min(.85, Math.max(inState/S.fall.duration, caught/S.fall.goal));
    pT = .20 + .18*k;
    dropR += (.062 - dropR)*.02*dt;
    /* the game: lights rise from below, the drop must touch them */
    const aspect = innerWidth/innerHeight, secDt = rawDt*16.667/1000;
    if (!gameDone){
      const alive = orbList.filter(o => o.alive > 0).length;
      if (now > nextSpawn && alive < 3){
        const o = orbList.find(o => o.alive === 0);
        if (o){ o.x = (Math.random() - .5)*aspect*.7; o.y = -.62; o.phase = Math.random()*6.28; o.alive = 1; }
        nextSpawn = now + 1100 + Math.random()*800;
      }
      orbList.forEach((o, i) => {
        if (o.alive > 0){
          o.y += (.095 + .015*Math.sin(o.phase))*Math.min(secDt, .1); o.x += Math.sin(sec*1.2 + o.phase)*.0008*dt;
          if (o.y > .62) o.alive = 0;
          else if (Math.hypot(o.x - dropPos[0], o.y - dropPos[1]) < .12){
            o.alive = 0; caught++; world.burst(o.x, o.y); audio.catchOrb(caught); showScore();
            scoreEl.classList.add('pop'); setTimeout(() => scoreEl.classList.remove('pop'), 260);
            if (caught >= S.fall.goal){ gameDone = true; showCap(S.fall.done); hint(null); timers.push(setTimeout(() => enter('window'), 2600)); }
          }
        }
        world.setOrb(i, o.x, o.y, o.phase, o.alive);
      });
      if (inState > S.fall.duration){ gameDone = true; timers.push(setTimeout(() => enter('window'), 1500)); }
    }
  }
  if (state === 'window'){
    if (fog.written){
      if (fogBase < 0 && inState > 10000){ fogBase = fog.coverage(); }
      else if (fogBase > 0 && (now | 0) % 6 === 0){ const cov = fog.coverage(); if (cov < fogBase*.84) enter('beads'); }
    }
  }
  if (state === 'sea'){
    pT = Math.min(.99, pT + .00005*dt);
    if (pS > .86 && !complimentShown){ complimentShown = true; if (S.sea.compliment) showCap(Object.assign({ dur: 11000 }, S.sea.compliment)); }
    if (pS > .975) enter('end');
  }

  /* --- smoothing --- */
  const prevP = pS;
  pS += (pT - pS)*Math.min(1, .025*dt);
  velS += ((Math.abs(pS - prevP)/Math.max(dt, .1))*90 - velS)*.12*dt;
  const follow = state === 'cloud' || state === 'fall';
  const lift = (state === 'fall' && isTouch) ? .13 : 0;     /* on a phone the drop rides just above the finger so it stays visible */
  const tx = follow ? dropTarget[0]*.9 : 0, ty = follow ? Math.min(.45, dropTarget[1]*.9 + lift) : 0;
  const k = state === 'fall' ? .12 : .035;
  dropPos[0] += (tx - dropPos[0])*k*dt; dropPos[1] += (ty - dropPos[1])*k*dt;
  if (state === 'fall') dropPos[1] += Math.sin(sec*2.2)*.0006*dt;
  world.set('p', pS); world.set('vel', Math.min(2.5, velS)); world.set('hold', Math.min(1, hold));
  world.set('mouse', mouse.slice()); world.set('drop', dropPos.slice()); world.set('dropR', dropR);

  /* --- fog --- */
  fogVis += (fogVisT - fogVis)*.04*dt;
  fog.canvas.style.opacity = fogVis.toFixed(3);
  fog.frame(dt, now, fogVis > .01);

  /* --- lightning: on tap in the fall, and now and then by itself --- */
  if (state === 'fall' && sec > nextFlash){ flashAt = sec; nextFlash = sec + 7 + Math.random()*8; audio.thunder(); }
  if (state !== 'fall') nextFlash = Math.max(nextFlash, sec + 3);
  const age = sec - flashAt;
  const flash = age < 0 ? 0 : Math.exp(-age*16) + (age > .14 ? .55*Math.exp(-(age - .14)*11) : 0);
  world.set('flash', state === 'fall' || state === 'cloud' ? flash : 0);

  document.body.classList.toggle('dawn', pS > .9);

  /* --- caption lifetimes --- */
  live = live.filter(r => !r.dead);
  for (const r of live) if (!r.stay && now - r.born > r.dur) hideCap(r);

  world.frame(dt);
  audio.frame(now, pS, state);
}
requestAnimationFrame(loop);
})();
</script>
</body>
